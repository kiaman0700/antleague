<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>인터넷 연결 확인 · 개미리그</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #111; color: #f2f2f2; font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; letter-spacing: -0.01em; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; box-sizing: border-box; text-align: center; word-break: keep-all; }
      img { width: 72px; height: 72px; }
      h1 { margin: 6px 0 0; font-size: 22px; font-weight: 800; }
      p { margin: 0; max-width: 320px; color: #c8c8c8; font-size: 15px; line-height: 1.6; }
      a { margin-top: 10px; display: inline-flex; align-items: center; justify-content: center; min-width: 180px; height: 48px; padding: 0 20px; border-radius: 12px; background: #6b58ee; color: #fff; font-weight: 700; font-size: 16px; text-decoration: none; }
      a:hover { background: #5f4de3; }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      small { color: #9a9a9a; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/mark.svg" alt="" />
      <h1>인터넷 연결이 끊겼어요</h1>
      <p>개미리그는 같은 시장에서 함께 겨루는 게임이라 인터넷이 필요해요. 와이파이나 데이터를 확인해 주세요.</p>
      <a href="/">다시 연결하기</a>
      <small>하던 대결은 서버에 그대로 있어요. 연결되면 이어서 할 수 있어요.</small>
    </main>
  </body>
</html>
